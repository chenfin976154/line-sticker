<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE 貼圖工具 (Proxy繞道版)</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <script type="module">
        // 1. 程式碼：降級回 1.3.0 穩定版 (使用 default export，解決語法錯誤)
        import removeBackground from 'https://esm.sh/@imgly/background-removal@1.3.0';
        window.removeBackground = removeBackground; 
        
        // 2. 模型資料：使用 AllOrigins Proxy 繞過本地封鎖
        // 這會強制幫我們轉發請求，解決 CORS 和 403 問題
        const targetUrl = 'https://unpkg.com/@imgly/background-removal-data@1.3.0/dist/';
        const proxyUrl = 'https://api.allorigins.win/raw?url=';
        
        window.rbConfig = {
            publicPath: proxyUrl + targetUrl,
            debug: true // 開啟除錯模式以便觀察
        };
    </script>

    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        
        #errorBanner {
            display: none;
            background-color: #ffebee; color: #c62828; border: 2px solid #c62828;
            padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: left;
        }

        .section-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .controls { margin: 20px 0; padding: 20px; background: #f8f9fa; border-radius: 10px; border: 1px solid #e9ecef; }
        input[type="file"] { margin-top: 10px; display: block; width: 100%; }
        
        .btn {
            background-color: #00B900; color: white; border: none; padding: 14px 25px;
            font-size: 16px; cursor: pointer; border-radius: 8px; margin-top: 15px; width: 100%;
            transition: all 0.2s; font-weight: bold;
        }
        .btn:hover { background-color: #009900; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }

        #progressContainer { display: none; margin-top: 20px; }
        .progress-bar-bg { width: 100%; height: 24px; background-color: #e0e0e0; border-radius: 12px; overflow: hidden; }
        .progress-bar-fill {
            height: 100%; width: 0%; background-color: #00B900;
            transition: width 0.2s ease;
        }
        #progressText { text-align: center; font-size: 14px; color: #555; margin-top: 8px; font-weight: bold; }
        
        .compare-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; display: none; }
        .img-wrapper { width: 100%; height: 300px; border: 2px dashed #ccc; border-radius: 10px; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #fff; }
        .img-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .checkerboard { background-image: linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%), linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%); background-size: 20px 20px; }

        #previewGrid { display: grid; gap: 15px; margin-top: 25px; justify-content: center; grid-template-columns: repeat(3, 1fr); }
        .sticker-item { border: 1px solid #eee; padding: 10px; background: #fff; border-radius: 10px; }
        .sticker-item img { max-width: 100%; height: auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>LINE 貼圖工具 (Proxy繞道版)</h1>

    <div id="errorBanner">
        <h3>⚠️ 偵測到錯誤開啟方式！</h3>
        <p>請透過 Live Server 或 Python Server 開啟。</p>
    </div>

    <div class="section-card">
        <h2>🛠️ AI 智慧去背</h2>
        <div class="controls">
            <input type="file" id="bgInput" accept="image/*">
        </div>
        
        <button id="bgBtn" class="btn" disabled>開始 AI 去背運算</button>

        <div id="progressContainer">
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>
            <div id="progressText">準備中...</div>
        </div>
        
        <div class="compare-container" id="compareSection">
            <div class="preview-box"><h4>原始圖片</h4><div class="img-wrapper"><img id="originalPreviewImg"></div></div>
            <div class="preview-box">
                <h4>去背結果</h4>
                <div class="img-wrapper checkerboard"><img id="removedPreviewImg"></div>
                <button id="downloadSingleBtn" class="btn" style="background-color: #555; margin-top: 10px;">下載 PNG</button>
            </div>
        </div>
    </div>

    <div class="section-card" style="border-top: 5px solid #00B900;">
        <h2>✂️ 九宮格裁切</h2>
        <div class="controls">
            <label><input type="radio" name="gridSize" value="3" checked> 3 x 3</label>
            <label><input type="radio" name="gridSize" value="4"> 4 x 4</label>
            <input type="file" id="cropInput" accept="image/png, image/jpeg" style="margin-top:10px;">
        </div>
        <div id="previewGrid"></div>
        <button id="downloadZipBtn" class="btn" style="display:none;">打包下載 ZIP</button>
    </div>
</div>

<script>
    // --- 1. 自動偵測開啟方式 ---
    if (window.location.protocol === 'file:') {
        document.getElementById('errorBanner').style.display = 'block';
        document.getElementById('bgBtn').disabled = true;
    }

    // --- 變數 ---
    const bgInput = document.getElementById('bgInput');
    const bgBtn = document.getElementById('bgBtn');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const compareSection = document.getElementById('compareSection');
    const originalPreviewImg = document.getElementById('originalPreviewImg');
    const removedPreviewImg = document.getElementById('removedPreviewImg');
    
    let fileToProcess = null;
    let removedBlob = null;

    bgInput.addEventListener('change', (e) => {
        fileToProcess = e.target.files[0];
        if (fileToProcess && window.location.protocol !== 'file:') {
            originalPreviewImg.src = URL.createObjectURL(fileToProcess);
            compareSection.style.display = "none";
            document.getElementById('progressContainer').style.display = "none";
            bgBtn.disabled = false;
        }
    });

    bgBtn.addEventListener('click', async () => {
        if (!window.removeBackground) {
            alert("正在連線 AI 伺服器，請稍後再試...");
            return;
        }

        bgBtn.disabled = true;
        document.getElementById('progressContainer').style.display = "block";
        progressBar.style.width = "5%";
        progressText.innerText = "正在透過 Proxy 下載模型...";

        try {
            const config = window.rbConfig || {};
            
            // 進度條顯示
            config.progress = (key, current, total) => {
                const percent = total ? Math.round((current / total) * 100) : 50;
                progressBar.style.width = `${percent}%`;
                
                if(key.includes('fetch')) {
                    progressText.innerText = `下載中... (${percent}%)`;
                } else {
                    progressText.innerText = "AI 去背運算中...";
                    progressBar.style.width = "95%";
                }
            };

            // 執行去背
            const blob = await window.removeBackground(fileToProcess, config);
            
            removedBlob = blob;
            removedPreviewImg.src = URL.createObjectURL(blob);
            compareSection.style.display = "grid";
            progressBar.style.width = "100%";
            progressText.innerText = "✅ 完成！";

        } catch (error) {
            console.error(error);
            progressText.innerText = "❌ 失敗 (請看 Console)";
            alert("執行失敗。這可能是網路代理回應過慢，請多試一次，或建議直接將網頁上傳到 GitHub Pages (那邊沒有這些限制)。");
        } finally {
            bgBtn.disabled = false;
        }
    });

    document.getElementById('downloadSingleBtn').addEventListener('click', () => {
        if (removedBlob) saveAs(removedBlob, "sticker_bg_removed.png");
    });

    // --- 裁切功能 ---
    const cropInput = document.getElementById('cropInput');
    const previewGrid = document.getElementById('previewGrid');
    const downloadZipBtn = document.getElementById('downloadZipBtn');
    
    cropInput.addEventListener('change', (e) => {
        if(e.target.files[0]) processCrop(e.target.files[0]);
    });

    function processCrop(file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                const size = parseInt(document.querySelector('input[name="gridSize"]:checked').value);
                const w = img.width/size, h = img.height/size;
                const zip = new JSZip();
                const folder = zip.folder("stickers");
                previewGrid.innerHTML = '';
                previewGrid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
                
                let count=0;
                for(let r=0; r<size; r++) {
                    for(let c=0; c<size; c++) {
                        const cvs = document.createElement('canvas');
                        cvs.width = 370; cvs.height = 320;
                        const ctx = cvs.getContext('2d');
                        const scale = Math.min(370/w, 320/h);
                        const dx = (370-w*scale)/2, dy = (320-h*scale)/2;
                        
                        ctx.drawImage(img, c*w, r*h, w, h, dx, dy, w*scale, h*scale);
                        const url = cvs.toDataURL();
                        
                        previewGrid.innerHTML += `<div class="sticker-item"><img src="${url}"></div>`;
                        folder.file(`sticker_${++count}.png`, url.split(',')[1], {base64:true});
                    }
                }
                downloadZipBtn.style.display = 'block';
                downloadZipBtn.onclick = () => zip.generateAsync({type:"blob"}).then(c => saveAs(c, "stickers.zip"));
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
